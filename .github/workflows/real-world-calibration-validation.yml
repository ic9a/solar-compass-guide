name: Real-world calibration validation

on:
  pull_request:
    paths:
      - "validation/real-world-data/**"
      - "scripts/validate-real-world-calibration.mjs"
      - ".github/workflows/real-world-calibration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-world-calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate provenance, counts, neutral calibration and holdout gate
        run: node scripts/validate-real-world-calibration.mjs
