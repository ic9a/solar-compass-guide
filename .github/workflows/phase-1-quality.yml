name: Production readiness quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  energy-model:
    name: Energy model validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Freeze TypeScript engine outputs
        run: npx --yes tsx@4.20.6 validation/energy-model/export-current.ts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: validation/energy-model/requirements.txt
      - name: Install scientific references
        run: pip install -r validation/energy-model/requirements.txt
      - name: Run deterministic hourly benchmark
        run: python validation/energy-model/run_comparison.py --label final
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: energy-model-final
          path: validation/energy-model/output
          if-no-files-found: error
          retention-days: 30

  playwright:
    name: Playwright — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium mobile
            browser: chromium
            projects: "--project=mobile-320 --project=mobile-360 --project=mobile-375 --project=mobile-390 --project=mobile-412 --project=landscape --project=tablet"
          - label: Chromium desktop
            browser: chromium
            projects: "--project=desktop-1024 --project=desktop-1280 --project=desktop-1440"
          - label: Firefox
            browser: firefox
            projects: "--project=firefox-desktop"
          - label: WebKit
            browser: webkit
            projects: "--project=webkit-desktop"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.label }} tests
        run: npx playwright test ${{ matrix.projects }}
      - name: Preserve ${{ matrix.label }} evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ strategy.job-index }}-${{ matrix.browser }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  public-snapshot:
    name: Clean public snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Export clean tracked source
        run: npm run public:export -- .public-snapshot
      - name: Install clean snapshot dependencies
        working-directory: .public-snapshot
        run: npm ci
      - name: Verify clean snapshot
        working-directory: .public-snapshot
        run: npm run public:verify
      - name: Check clean snapshot types and lint
        working-directory: .public-snapshot
        run: |
          npm run typecheck
          npm run lint:phase1
          npm run lint:phase2
          npm run lint:final
      - name: Test clean snapshot
        working-directory: .public-snapshot
        run: npm test
      - name: Build clean snapshot
        working-directory: .public-snapshot
        run: npm run build
      - name: Validate redistributable frozen evidence
        working-directory: .public-snapshot
        run: node scripts/validate-real-world-calibration.mjs
      - name: Install representative browser
        working-directory: .public-snapshot
        run: npx playwright install --with-deps chromium
      - name: Run clean snapshot browser smoke
        working-directory: .public-snapshot
        run: npx playwright test tests/e2e/public-snapshot-smoke.spec.ts --project=desktop-1280

  browser-gate:
    name: Browser gate
    if: always()
    needs: [playwright, public-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser and clean-room job
        env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          SNAPSHOT_RESULT: ${{ needs.public-snapshot.result }}
        run: |
          test "$PLAYWRIGHT_RESULT" = "success"
          test "$SNAPSHOT_RESULT" = "success"
